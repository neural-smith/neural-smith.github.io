<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.logo | escape }}">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ site.logo | escape }}">
  <link rel="apple-touch-icon" href="{{ site.logo | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <title>{{ page.title | default: site.title | escape }}</title>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Neural Smith home">
        <img src="{{ site.logo | escape }}" alt="" width="42" height="42" decoding="async">
        <span>neural<span class="brand-accent">-</span>smith</span>
      </a>
      <nav aria-label="Main navigation" class="nav">
        <a href="{{ '/#tools' | relative_url }}">Tools</a>
        <a href="https://github.com/neural-smith" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="footer">
    <div class="container footer-inner">
      <span>© {{ site.time | date: '%Y' }} Neural Smith · Open-source tools.</span>
      <a href="https://github.com/neural-smith" rel="noopener noreferrer">GitHub organization <span aria-hidden="true">↗</span></a>
    </div>
  </footer>
</body>
</html>
